<style>
  :root {
    --page: #0c0d11;
    --page-ink: #eef0f6;
    --page-ink-soft: #9195a3;
    --card: #eef7f4;
    --card-alt: #dbeeff;
    --card-ink: #10151a;
    --stamp-fill: #ff4a1c;
    --stamp-bright: #ff7a4d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--page);
    color: var(--page-ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(560px 360px at 50% 0%, color-mix(in srgb, var(--stamp-fill) 20%, transparent), transparent 70%),
      var(--page);
  }
  .wrap {
    min-height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 36px;
  }
  header { text-align: center; }
  .badge {
    font-size: 2rem;
    line-height: 1;
    margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(2rem, 9vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--page-ink);
  }
  h1 span { color: var(--stamp-fill); }
  .lede {
    margin: 0 auto;
    max-width: 320px;
    color: var(--page-ink-soft);
    font-size: 1.02rem;
    line-height: 1.55;
  }
  .groups {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--card);
    color: var(--card-ink);
    text-decoration: none;
    border-radius: 16px;
    padding: 20px 22px;
    min-height: 68px;
    font-weight: 700;
    font-size: 1.15rem;
    box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.55);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .group:active { transform: scale(0.97); }
  .group.geral { background: var(--card-alt); }
  .go {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 999px;
    background: var(--stamp-fill);
    color: #fff;
    font-weight: 700;
    font-size: 1.1rem;
  }
  @media (hover: hover) {
    .group:hover { box-shadow: 0 12px 26px -8px rgba(0, 0, 0, 0.65); }
    .group:hover .go { background: var(--stamp-bright); }
  }
  footer { text-align: center; }
  .disclaimer {
    margin: 0 auto;
    max-width: 340px;
    color: var(--page-ink-soft);
    font-size: 0.8rem;
    line-height: 1.55;
  }
</style>
