<style>
  :root {
    --page: #0c0d11;
    --page-ink: #eef0f6;
    --page-ink-soft: #9195a3;
    --card: #eef7f4;
    --card-alt: #dbeeff;
    --card-ink: #10151a;
    --stamp-fill: #ff4a1c;
    --stamp-bright: #ff7a4d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--page);
    color: var(--page-ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 32px 20px 24px;
  }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(1.9rem, 8vw, 2.4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--page-ink);
  }
  h1 span { color: var(--stamp-fill); }
  .lede {
    margin: 0 0 24px;
    color: var(--page-ink-soft);
    font-size: 1rem;
    line-height: 1.5;
  }
  .groups {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .group {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    color: var(--card-ink);
    text-decoration: none;
    border-radius: 14px;
    padding: 18px 20px;
    min-height: 60px;
    font-weight: 700;
    font-size: 1.08rem;
    box-shadow: 0 6px 16px -6px rgba(0, 0, 0, 0.5);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .group:active { transform: scale(0.97); }
  .group.geral { background: var(--card-alt); }
  .go {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    background: var(--stamp-fill);
    color: #fff;
    font-weight: 700;
  }
  @media (hover: hover) {
    .group:hover { box-shadow: 0 10px 22px -6px rgba(0, 0, 0, 0.6); }
    .group:hover .go { background: var(--stamp-bright); }
  }
  footer {
    padding-top: 28px;
    text-align: center;
  }
  .disclaimer {
    margin: 0;
    color: var(--page-ink-soft);
    font-size: 0.78rem;
    line-height: 1.5;
  }
</style>
